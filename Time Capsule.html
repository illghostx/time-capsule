<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Time Capsule</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--text:#1d1d1f;--muted:#6b6b70;--accent:#6c5ce7;--border:#e3e1da;--ok:#00a37a;--danger:#d63031;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1014;--card:#181a21;--text:#ececf1;--muted:#8d8fa0;--accent:#a29bfe;--border:#2a2d38;--ok:#55efc4;--danger:#ff7675}}
:root[data-theme="dark"]{--bg:#0f1014;--card:#181a21;--text:#ececf1;--muted:#8d8fa0;--accent:#a29bfe;--border:#2a2d38;--ok:#55efc4;--danger:#ff7675}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;transition:background .3s,color .3s}
header,main{max-width:720px;margin:0 auto;padding:1rem}
header{display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:1.5rem}
.tag{color:var(--muted);margin-top:0}
nav{display:flex;gap:.5rem;margin-bottom:1rem}
nav button{flex:1;background:var(--card);color:var(--text);border:1px solid var(--border)}
nav button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
form,.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1rem}
form{display:grid;gap:.75rem}
.row{display:flex;gap:.75rem;flex-wrap:wrap}.row>*{flex:1;min-width:160px}
input,textarea,button{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:.6rem .8rem}
textarea{resize:vertical}
label{display:flex;flex-direction:column;font-size:.8rem;color:var(--muted);gap:.25rem}
button{cursor:pointer;font-weight:600;transition:transform .15s,opacity .15s}
button:hover{transform:translateY(-1px);opacity:.92}
.primary{background:var(--accent);color:#fff;border:none}
.ghost{background:transparent}
.error{color:var(--danger);margin:0;font-size:.9rem}
#vault{display:grid;gap:.75rem}
.card{animation:pop .35s ease both}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.card h3{margin:0;display:flex;justify-content:space-between;gap:.5rem}
.meta{color:var(--muted);font-size:.8rem}
.cd{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600;margin-top:.5rem}
.sealed{filter:blur(5px);user-select:none;margin:.5rem 0 0}
.msg{white-space:pre-wrap;margin:.6rem 0 0}
.open{border-color:var(--ok)}
.badge{color:var(--ok);font-size:.8rem;font-weight:700}
.del{margin-top:.6rem;font-size:.8rem;padding:.3rem .6rem;color:var(--danger)}
.empty{text-align:center;color:var(--muted)}
.note{font-size:.75rem;color:var(--muted);text-align:center;margin-top:1.5rem}
#toast{position:fixed;left:50%;bottom:calc(1.5rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--accent);color:#fff;padding:.7rem 1.1rem;border-radius:999px;opacity:0;pointer-events:none;transition:.3s;font-weight:600}
#toast.show{opacity:1;transform:translateX(-50%)}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><h1>⏳ Time Capsule</h1><button id="theme" class="ghost" aria-label="Toggle theme">🌓</button></header>
<main>
<p class="tag">Write to the future. Your message stays sealed until the unlock date.</p>
<nav>
<button id="tCreate" class="on">✍️ Seal a capsule</button>
<button id="tVault">🗄️ My Vault <span id="count"></span></button>
</nav>

<section id="create">
<form id="form">
<div class="row"><input name="author" placeholder="Your name" maxlength="40" required><input name="title" placeholder="Capsule title" maxlength="80" required></div>
<textarea name="message" placeholder="Dear future me..." maxlength="2000" rows="5" required></textarea>
<div class="row"><label>Unlock on<input type="datetime-local" name="unlockAt" required></label><button class="primary" type="submit">Seal capsule 🔒</button></div>
<p id="err" class="error" hidden></p>
</form>
</section>

<section id="vaultWrap" hidden><div id="vault"></div></section>
<p class="note">Capsules are saved in this browser only. Use the same device and browser to open them.</p>
</main>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const KEY='time-capsules-v1';
let capsules=[];
try{capsules=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(capsules))}catch(e){}}

// theme
try{const t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
$('#theme').onclick=()=>{
  const dark=document.documentElement.dataset.theme==='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);
  const n=dark?'light':'dark';document.documentElement.dataset.theme=n;
  try{localStorage.setItem('theme',n)}catch(e){}
};

// tabs
function show(tab){
  $('#create').hidden=tab!=='create';$('#vaultWrap').hidden=tab!=='vault';
  $('#tCreate').classList.toggle('on',tab==='create');$('#tVault').classList.toggle('on',tab==='vault');
  if(tab==='vault')render();
}
$('#tCreate').onclick=()=>show('create');
$('#tVault').onclick=()=>show('vault');

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2600)}
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
function fmt(ms){const s=Math.max(0,Math.floor(ms/1000)),p=n=>String(n).padStart(2,'0');
  return Math.floor(s/86400)+'d '+p(Math.floor(s%86400/3600))+'h '+p(Math.floor(s%3600/60))+'m '+p(s%60)+'s'}

function render(){
  const box=$('#vault');box.replaceChildren();
  const open=capsules.filter(c=>new Date(c.unlockAt)<=Date.now()).length;
  $('#count').textContent=capsules.length?'('+capsules.length+')':'';
  if(!capsules.length){box.append(el('p','empty','Your vault is empty. Seal your first capsule!'));return}
  [...capsules].sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).forEach(c=>{
    const unlocked=new Date(c.unlockAt)<=Date.now();
    const card=el('div','card'+(unlocked?' open':''));
    const h=el('h3');h.append(el('span','',c.title),unlocked?el('span','badge','🔓 OPENED'):el('span','','🔒'));
    card.append(h,el('div','meta','by '+c.author+' · sealed '+new Date(c.createdAt).toLocaleDateString()+' · unlocks '+new Date(c.unlockAt).toLocaleString()));
    if(unlocked){card.append(el('p','msg',c.message))}
    else{const cd=el('div','cd');cd.dataset.u=c.unlockAt;card.append(cd,el('p','sealed','This message is sealed until the unlock date arrives.'))}
    const d=el('button','del ghost','Delete');
    d.onclick=()=>{if(confirm('Delete this capsule forever?')){capsules=capsules.filter(x=>x.id!==c.id);save();render()}};
    card.append(d);box.append(card);
  });
  tick();
}
function tick(){
  let flip=false;
  document.querySelectorAll('.cd').forEach(n=>{const l=new Date(n.dataset.u)-Date.now();if(l<=0)flip=true;n.textContent=fmt(l)});
  if(flip){render();toast('🔓 A capsule just unlocked!')}
}
setInterval(tick,1000);

// create
function setMin(){const d=new Date(Date.now()+120000);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());$('[name=unlockAt]').min=d.toISOString().slice(0,16)}
setMin();
$('#form').onsubmit=e=>{
  e.preventDefault();
  const f=Object.fromEntries(new FormData(e.target)),when=new Date(f.unlockAt);
  const err=$('#err');err.hidden=true;
  if(isNaN(when)||when<=Date.now()+60000){err.textContent='Unlock date must be at least 1 minute in the future.';err.hidden=false;return}
  capsules.push({id:Date.now()+'-'+Math.random().toString(36).slice(2,7),title:f.title.trim(),author:f.author.trim(),message:f.message.trim(),unlockAt:when.toISOString(),createdAt:new Date().toISOString()});
  save();e.target.reset();setMin();
  toast('Sealed! Find it in 🗄️ My Vault');show('vault');
};
render();
</script>
</body>
</html>
